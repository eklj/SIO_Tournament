<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — SIO Tournament</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <a class="auth-back" href="index.html">← Retour à l'accueil</a>

        <section class="auth-card">
            <div class="auth-card-header">
                <h1>Connexion</h1>
            </div>

            <div class="auth-card-body">
                <p class="auth-subtitle">Connecte-toi à ton compte SIO Tournament.</p>

                <div id="loginMessage" class="auth-message" role="alert" aria-live="polite"></div>

                <form id="loginForm" class="auth-form">
                <div class="auth-field">
                    <label for="pseudo">Pseudo</label>
                    <input id="pseudo" name="pseudo" autocomplete="username" required>
                </div>

                <div class="auth-field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button id="loginSubmit" class="auth-submit" type="submit">
                    Se connecter
                </button>
                </form>

                <div class="auth-links">
                    <span>Pas encore de compte ?</span>
                    <a href="signin.html">Créer un compte</a>
                </div>
            </div>
        </section>
    </main>

    <script src="scripts/login.js" defer></script>
</body>
</html>
